[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-trading-engine"
version = "1.0.0"
description = "Production-grade quantitative trading engine with multi-asset support, optimal Kelly sizing, and real-world backtesting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.0",
    "yfinance>=0.2.32",
    "pandas-ta>=0.3.14b0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
