[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-trading-engine"
version = "1.0.0"
description = "Production-grade quantitative trading engine with multi-asset support, optimal Kelly sizing, and real-world backtesting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
