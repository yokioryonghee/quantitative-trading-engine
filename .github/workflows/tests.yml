name: Engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            pandas: 'pandas>=2.2,<3'
          - python: '3.12'
            pandas: 'pandas>=3,<4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' '${{ matrix.pandas }}'
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
